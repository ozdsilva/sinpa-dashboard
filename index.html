<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento de Atendimento</title>
    <!-- Chart.js para renderização dos gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #003366;
            margin-bottom: 30px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid #003366;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #666;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #003366;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }
        .chart-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 350px;
        }
        .chart-card h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Indicadores e Análise de Atendimento</h1>

    <!-- Cartões de Métricas Consolidadas -->
    <div class="metrics-grid">
        <div class="card">
            <h3>Atendidos no Horário / Adiantados</h3>
            <!-- No horário ou até 15 minutos de atraso -->
            <div id="pct-no-horario" class="value">--%</div>
        </div>
        <div class="card">
            <h3>Atendimentos com Atraso (>15 min)</h3>
            <!-- Atraso real superior a 15 minutos -->
            <div id="pct-atrasados" class="value">--%</div>
        </div>
    </div>

    <!-- Seção de Gráficos -->
    <div class="charts-grid">
        <div class="chart-card">
            <h3>Volume de Atendimentos por Status</h3>
            <canvas id="chartStatusAtendimento"></canvas>
        </div>
    </div>
</div>

<script>
    // --- DADOS DE EXEMPLO (Substitua pela integração de dados do seu sistema) ---
    const dadosAtendimentos = [
        { requisitante: "Nathalia", agendado: "17:10", inicioAtendimento: "17:37" }, // Diferença: 27 min -> ATRASADO
        { requisitante: "Sabrina",  agendado: "17:05", inicioAtendimento: "17:15" }, // Diferença: 10 min -> NO HORÁRIO
        { requisitante: "Andrea",   agendado: "17:30", inicioAtendimento: "17:42" }, // Diferença: 12 min -> NO HORÁRIO
        { requisitante: "Lucca",    agendado: "17:20", inicioAtendimento: "17:42" }, // Diferença: 22 min -> ATRASADO
        { requisitante: "Thiago",   agendado: "18:00", inicioAtendimento: "18:08" }  // Diferença: 8 min  -> NO HORÁRIO
    ];

    // --- FUNÇÕES AUXILIARES DE TEMPO ---
    
    // Converte "HH:MM" para minutos inteiros desde o início do dia
    function parseHora(strHora) {
        if (!strHora) return 0;
        const [horas, minutos] = strHora.split(':').map(Number);
        return (horas * 60) + minutos;
    }

    // --- PROCESSAMENTO DA REGRA DE NEGÓCIO ---
    
    function processarMétricas(atendimentos) {
        let totalAtendidos = atendimentos.length;
        
        let noHorarioOuAdiantados = 0;
        let atrasadosMais15Min = 0;

        atendimentos.forEach(at => {
            const agendado = parseHora(at.agendado);
            const atendimento = parseHora(at.inicioAtendimento);
            
            const diferenca = atendimento - agendado;

            // REGRA: Até 15 minutos é considerado dentro do horário/adiantado
            if (diferenca <= 15) {
                noHorarioOuAdiantados++;
            } else {
                atrasadosMais15Min++;
            }
        });

        // Atualização dos cartões de métricas na tela
        const pctNoHorario = totalAtendidos > 0 ? ((noHorarioOuAdiantados / totalAtendidos) * 100).toFixed(1) : 0;
        const pctAtrasados = totalAtendidos > 0 ? ((atrasadosMais15Min / totalAtendidos) * 100).toFixed(1) : 0;

        document.getElementById('pct-no-horario').innerText = `${pctNoHorario}%`;
        document.getElementById('pct-atrasados').innerText = `${pctAtrasados}%`;

        return { noHorarioOuAdiantados, atrasadosMais15Min };
    }

    // --- INICIALIZAÇÃO DOS GRÁFICOS ---
    
    window.onload = function() {
        const metricas = processarMétricas(dadosAtendimentos);

        // Renderização do Gráfico de Rosca/Pizza para os Status
        const ctxStatus = document.getElementById('chartStatusAtendimento').getContext('2d');
        new Chart(ctxStatus, {
            type: 'pie',
            data: {
                labels: ['No Horário / Adiantado (Até 15 min)', 'Com Atraso (>15 min)'],
                datasets: [{
                    data: [metricas.noHorarioOuAdiantados, metricas.atrasadosMais15Min],
                    backgroundColor: ['#28a745', '#dc3545'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    };
</script>

</body>
</html>
