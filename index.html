<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento de Atendimento</title>
    <!-- Chart.js para renderização dos gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #003366;
            margin-bottom: 30px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid #003366;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #666;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #003366;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }
        .chart-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 350px;
        }
        .chart-card h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Indicadores e Análise de Atendimento</h1>

    <!-- Cartões de Métricas Consolidadas -->
    <div class="metrics-grid">
        <div class="card">
            <h3>Média Geral de Atraso</h3>
            <!-- Média Agendamento x Atendimento real -->
            <div id="media-geral-atraso" class="value">-- min</div>
        </div>
        <div class="card">
            <h3>Atendidos no Horário / Adiantados</h3>
            <!-- Considerando tolerância de até 15 minutos -->
            <div id="pct-no-horario" class="value">--%</div>
        </div>
        <div class="card">
            <h3>Atendimentos com Atraso (>15 min)</h3>
            <div id="pct-atrasados" class="value">--%</div>
        </div>
    </div>

    <!-- Seção de Gráficos -->
    <div class="charts-grid">
        <div class="chart-card">
            <h3>Média de Atraso por Faixa Horária (15 min)</h3>
            <canvas id="chartAtrasoFaixa"></canvas>
        </div>
        <div class="chart-card">
            <h3>Volume de Atendimentos por Status</h3>
            <canvas id="chartStatusAtendimento"></canvas>
        </div>
    </div>
</div>

<script>
    // --- DADOS DE EXEMPLO (Substitua pela integração de dados do seu sistema) ---
    const dadosAtendimentos = [
        { requisitante: "Nathalia", agendado: "17:10", inicioAtendimento: "17:37", fimAtendimento: "17:50" },
        { requisitante: "Sabrina",  agendado: "17:05", inicioAtendimento: "17:39", fimAtendimento: "17:55" },
        { requisitante: "Andrea",   agendado: "17:30", inicioAtendimento: "17:42", fimAtendimento: "17:52" },
        { requisitante: "Lucca",    agendado: "17:20", inicioAtendimento: "17:42", fimAtendimento: "17:58" },
        { requisitante: "Adriana",  agendado: "17:15", inicioAtendimento: "17:44", fimAtendimento: "17:59" },
        { requisitante: "Victor",   agendado: "17:25", inicioAtendimento: "17:47", fimAtendimento: "18:05" },
        { requisitante: "Thiago",   agendado: "18:00", inicioAtendimento: "18:08", fimAtendimento: "18:18" } // Atendido em 8 min (Dentro do padrão de 15 min)
    ];

    // --- FUNÇÕES UTILITÁRIAS DE TEMPO ---
    
    // Converte "HH:MM" para minutos inteiros desde o início do dia
    function parseHora(strHora) {
        if (!strHora) return 0;
        const [horas, minutos] = strHora.split(':').map(Number);
        return (horas * 60) + minutos;
    }

    // Converte minutos de volta para o formato legível
    function formatarMinutos(minutosTotais) {
        const sinal = minutosTotais < 0 ? "-" : "";
        const minAbsoluto = Math.round(Math.abs(minutosTotais));
        const horas = Math.floor(minAbsoluto / 60);
        const minutos = minAbsoluto % 60;

        if (horas > 0) {
            return `${sinal}${horas}h ${minutos}min`;
        }
        return `${sinal}${minutos} min`;
    }

    // Arredonda o horário de agendamento para faixas de 15 minutos (ex: 17:10 -> 17:00, 17:15 -> 17:15)
    function obterFaixa15Min(horario) {
        const [horas, minutos] = horario.split(':').map(Number);
        const minutosArredondados = Math.floor(minutos / 15) * 15;
        return `${String(horas).padStart(2, '0')}:${String(minutosArredondados).padStart(2, '0')}`;
    }

    // --- PROCESSAMENTO DAS MÉTRICAS ---
    
    function processarMétricas(atendimentos) {
        let somaAtrasoGeral = 0; // Agendamento x Atendimento Inicial
        let totalAtendidos = atendimentos.length;
        
        let noHorarioOuAdiantados = 0;
        let atrasadosMais15Min = 0;

        atendimentos.forEach(at => {
            const agendado = parseHora(at.agendado);
            const atendimento = parseHora(at.inicioAtendimento);
            
            const diferenca = atendimento - agendado;
            somaAtrasoGeral += diferenca;

            // Nova Regra de Classificação (Tolerância de 15 minutos)
            if (diferenca <= 15) {
                noHorarioOuAdiantados++;
            } else {
                atrasadosMais15Min++;
            }
        });

        // 1. Média Geral de Atraso (Agendamento x Atendimento)
        const mediaGeralMinutos = totalAtendidos > 0 ? (somaAtrasoGeral / totalAtendidos) : 0;
        document.getElementById('media-geral-atraso').innerText = formatarMinutos(mediaGeralMinutos);

        // 2. Percentuais de Atendimento
        const pctNoHorario = totalAtendidos > 0 ? ((noHorarioOuAdiantados / totalAtendidos) * 100).toFixed(1) : 0;
        const pctAtrasados = totalAtendidos > 0 ? ((atrasadosMais15Min / totalAtendidos) * 100).toFixed(1) : 0;

        document.getElementById('pct-no-horario').innerText = `${pctNoHorario}%`;
        document.getElementById('pct-atrasados').innerText = `${pctAtrasados}%`;

        return { noHorarioOuAdiantados, atrasadosMais15Min };
    }

    // --- PROCESSAMENTO DO GRÁFICO DE FAIXA HORÁRIA ---
    
    function processarDadosGraficoFaixa(atendimentos) {
        const faixas = {}; // Estrutura: { "17:00": { somaTempo: X, qtd: Y } }

        atendimentos.forEach(at => {
            const faixa = obterFaixa15Min(at.agendado);
            const agendado = parseHora(at.agendado);
            const fim = parseHora(at.fimAtendimento); // Média de tempo: agendado x final do atendimento
            
            const diferencaTotal = fim - agendado;

            if (!faixas[faixa]) {
                faixas[faixa] = { somaTempo: 0, qtd: 0 };
            }

            faixas[faixa].somaTempo += diferencaTotal;
            faixas[faixa].qtd += 1;
        });

        const labels = Object.keys(faixas).sort();
        const valoresMedios = labels.map(faixa => {
            const dados = faixas[faixa];
            return (dados.somaTempo / dados.qtd).toFixed(1); // Média em minutos para aquela faixa
        });

        return { labels, valoresMedios };
    }

    // --- INICIALIZAÇÃO DOS GRÁFICOS ---
    
    window.onload = function() {
        const metricas = processarMétricas(dadosAtendimentos);
        const dadosFaixa = processarDadosGraficoFaixa(dadosAtendimentos);

        // 1. Renderização do Gráfico: Média de Atraso (Agendado x Fim) por Faixa
        const ctxFaixa = document.getElementById('chartAtrasoFaixa').getContext('2d');
        new Chart(ctxFaixa, {
            type: 'bar',
            data: {
                labels: dadosFaixa.labels,
                datasets: [{
                    label: 'Média de Tempo: Agendamento x Fim (minutos)',
                    data: dadosFaixa.valoresMedios,
                    backgroundColor: 'rgba(0, 51, 102, 0.75)',
                    borderColor: 'rgba(0, 51, 102, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Minutos' }
                    },
                    x: {
                        title: { display: true, text: 'Faixa Horária (Agendamento)' }
                    }
                }
            }
        });

        // 2. Renderização do Gráfico: Volume por Status (No Horário vs Atrasados)
        const ctxStatus = document.getElementById('chartStatusAtendimento').getContext('2d');
        new Chart(ctxStatus, {
            type: 'pie',
            data: {
                labels: ['No Horário / Adiantado (Até 15 min)', 'Com Atraso (>15 min)'],
                datasets: [{
                    data: [metricas.noHorarioOuAdiantados, metricas.atrasadosMais15Min],
                    backgroundColor: ['#28a745', '#dc3545'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    };
</script>

</body>
</html>
